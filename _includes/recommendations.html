{% assign awards = site.data.data.recommendations %}
{% if awards %}
<section class="section recommendations-section">
  <h2 class="section-title">{{ awards.title }}</h2>

  {% for award in awards.list %}
    <div class="item">
      <strong>{{ award.name }}</strong>
      <div>
        {{ award.organization }}
        {% if award.start %}
          ({{ award.start }})
        {% endif %}
      </div>
    </div>
  {% endfor %}
</section>
{% endif %}
